version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ownrex-backend:latest
    container_name: ownrex-backend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env  # Load from .env file (create from env.docker.example)
    environment:
      # Server Configuration
      - NODE_ENV=production
      - PORT=8000

      # OpenAI Configuration (REQUIRED - set your API key)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ORGANIZATION=${OPENAI_ORGANIZATION:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}

      # Model Configuration
      - DEFAULT_CHAT_MODEL=${DEFAULT_CHAT_MODEL:-gpt-4}
      - DEFAULT_COMPLETION_MODEL=${DEFAULT_COMPLETION_MODEL:-gpt-3.5-turbo-instruct}
      - DEFAULT_EMBEDDING_MODEL=${DEFAULT_EMBEDDING_MODEL:-text-embedding-3-small}

      # Authentication
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - OWNREX_API_KEY=${OWNREX_API_KEY:-ownrex-default-key}

      # Cache Configuration
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-3600}
      - CACHE_TYPE=${CACHE_TYPE:-memory}

      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE_ENABLED=${LOG_FILE_ENABLED:-false}

      # CORS
      - CORS_ORIGIN=${CORS_ORIGIN:-*}

      # Telemetry
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}

    # Mount logs directory (optional)
    volumes:
      - ./logs:/app/logs

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health/live', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    networks:
      - ownrex-network

  # Optional: Redis for caching (uncomment if using Redis cache)
  # redis:
  #   image: redis:7-alpine
  #   container_name: ownrex-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - ownrex-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3

networks:
  ownrex-network:
    driver: bridge

# Uncomment if using Redis
